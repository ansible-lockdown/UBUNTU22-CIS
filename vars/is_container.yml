# File to skip controls if container
# Based on standard image no changes
# it expected all pkgs required for the container are already installed

## controls

# Firewall
ubtu22cis_firewall_package: None

# ptrace_scope - yama LSM is not exposed at /proc/sys/kernel/yama in a container
ubtu22cis_rule_1_5_2: false

# time sync - systemd-timesyncd unit conditions fail in a container
ubtu22cis_rule_2_3_2_1: false
ubtu22cis_rule_2_3_2_2: false

