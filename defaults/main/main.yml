# defaults file for UBUNTU22-CIS
# WARNING:
# These values may be overridden by other vars-setting options(e.g. like the below 'container_vars_file'), as explained here:
# https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_variables.html#variable-precedence-where-should-i-put-a-variable

## Switching on/off specific baseline sections
# These variables govern whether the tasks of a particular section are to be executed when running the role.
# E.g: If you want to execute the tasks of Section 1 you should set the "_section1" variable
# to "true". If you do not want the tasks from that section to get executed you simply set the variable to "false".
ubtu22cis_section1: true
ubtu22cis_section2: true
ubtu22cis_section3: true
ubtu22cis_section4: true
ubtu22cis_section5: true
ubtu22cis_section6: true
ubtu22cis_section7: true

## Reboot system before audit
# System will reboot if false, can give better audit results
skip_reboot: true

# set true if running inside a container (skips kernel/mount tasks)
system_is_container: false

# Place to find the container yml file for your environment - /vars/...
container_vars_file: is_container.yml

# Used for audit
ubtu22cis_level_1: true
ubtu22cis_level_2: true

# Create managed not custom local_facts files
create_benchmark_facts: true
ansible_facts_path: /etc/ansible/facts.d

## Benchmark name used by auditing control role
# The audit variable found at the base
benchmark: UBUNTU22-CIS
## metadata for Audit benchmark
benchmark_version: v3.0.0

# We've defined disruption-high to indicate items that are likely to cause
# disruption in a normal workflow.  These items can be remediated automatically
# but are disabled by default to avoid disruption.
# Value of true runs disruptive tasks, value of false will skip disruptive tasks
ubtu22cis_disruption_high: true

## Unrestricted boot
# Setting this variable to false enables the system to
# boot *without* querying for the bootloader password.
ubtu22cis_ask_passwd_to_boot: false  # pragma: allowlist secret

# skip tests that fail in CI/test environments
ubtu22cis_skip_for_test: false

# skip events for ec2 instance testing pipeline
# set true to skip EC2-incompatible tasks (e.g., GRUB, reboot)
system_is_ec2: false

## Root user used
# Root by default is not used unless setup by user
# The role will only run certain commands if set to true
# This allows the ability to skip tasks that may cause an issue
ubtu22cis_uses_root: false

# UID settings for interactive users
# These are discovered via logins.def if set true
discover_int_uid: false
# This variable sets the minimum number from which to search for UID
# Note that the value will be dynamically overwritten if variable `discover_int_uid` has
# been set to `true`.
min_int_uid: 1000

# This variable sets the maximum number at which the search stops for UID
# Note that the value will be dynamically overwritten if variable `discover_int_uid` has
# been set to `true`.
max_int_uid: 65533

