---

# This is a playbook to test the tasks.
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    system_is_container: true
    skip_reboot: true
    setup_audit: true
    run_audit: true
    # root in a container has no password; 5.2.4 asserts the connecting user does
    ubtu22cis_rule_5_2_4: false

  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
