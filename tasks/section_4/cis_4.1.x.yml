---

- name: "4.1.1 | PATCH | Ensure ufw is installed"
  when: ubtu22cis_rule_4_1_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_4.1.1
    - apt
    - ufw
    - NIST800-53R5_SC-7
    - CCI-002314
  ansible.builtin.package:
    name: ufw
    state: present

# Adding the allow OpenSSH rule while enabling ufw to allow ansible to run after enabling
- name: "4.1.2 | PATCH | Ensure ufw service is configured"
  when: ubtu22cis_rule_4_1_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_4.1.2
    - ufw
    - NIST800-53R5_AC-17
    - CCI-002314
  block:
    - name: "4.1.2 | PATCH | Ensure ufw service is configured | ssh port enabled"
      community.general.ufw:
        rule: allow
        name: OpenSSH
        state: enabled

    - name: "4.1.2 | PATCH | Ensure ufw service is configured | service"
      ansible.builtin.systemd:
        name: ufw
        enabled: true
        state: started

- name: "4.1.3 | PATCH | Ensure ufw incoming default is configured"
  when: ubtu22cis_rule_4_1_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_4.1.3
    - ufw
    - NIST800-53R5_CM-7
  community.general.ufw:
    default: deny
    direction: incoming
  notify: Reload ufw

- name: "4.1.4 | PATCH | Ensure ufw outgoing default is configured"
  when: ubtu22cis_rule_4_1_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_4.1.4
    - ufw
    - NIST800-53R5_CM-7
  block:
    - name: "4.1.4 | PATCH | Ensure ufw outgoing default is configured |Added permitted rules"
      community.general.ufw:
        rule: allow
        direction: out
        proto: "{{ item.proto }}"
        to_port: '{{ item.port }}'
      loop: "{{ ubtu22cis_ufw_allow_out_ports }}"
      loop_control:
        label: "{{ item.port }}"
      notify: Reload ufw

    - name: "4.1.4 | PATCH | Ensure ufw outgoing default is configured | Set outgoing default deny"
      community.general.ufw:
        default: deny
        direction: outgoing
      notify: Reload ufw

- name: "4.1.5 | PATCH | Ensure ufw routed default is configured"
  when: ubtu22cis_rule_4_1_5
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_4.1.5
    - ufw
    - NIST800-53R5_CM-7
  community.general.ufw:
    default: deny
    direction: routed
  notify: Reload ufw
