---

- name: "3.1.1 | PATCH | Ensure IPv6 status is identified"
  when:
    - ubtu22cis_rule_3_1_1
    - not ubtu22cis_ipv6_required
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_3.1.1
    - ipv6
    - NIST800-53R5_CM-7
  block:
    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Replace ipv6.disable if it exists"
      when: ubtu22cis_ipv6_disable == 'grub'
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX=.*)\bipv6\.disable=\d\b(.*$)'
        replace: '\1ipv6.disable=1\2'
      register: discovered_ipv6disable_replaced
      notify: Grub update

    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Check grub cmdline linux"
      ansible.builtin.shell: |
        set -o pipefail
        grep "GRUB_CMDLINE_LINUX=" /etc/default/grub | cut -f2 -d'"'
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: discovered_grub_cmdline_settings.rc not in [0, 1]
      check_mode: false
      register: discovered_grub_cmdline_settings

    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Insert ipv6.disable if it doesn't exist"
      when:
        - ubtu22cis_ipv6_disable == 'grub'
        - discovered_ipv6disable_replaced is not changed
        - "'ipv6.disable' not in discovered_grub_cmdline_settings.stdout"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX=".*)"$'
        line: '\1 ipv6.disable=1"'
        backrefs: true
      notify: Grub update

    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Remove net.ipv6.conf.all.disable_ipv6"
      when: ubtu22cis_ipv6_disable == 'sysctl'
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/{{ item }}"
        owner: root
        group: root
        mode: 'g-wx,o-rwx'
      notify: Flush ipv6 route table
      loop:
        - etc/sysctl.d/60-disable_ipv6.conf
      loop_control:
        label: "{{ item }}"

- name: "3.1.2 | PATCH | Ensure wireless interfaces are not available"
  when:
    - ubtu22cis_rule_3_1_2
    - prelim_wireless_adapters_exist is not skipped
    - prelim_wireless_adapters_exist.stdout | length > 0
  tags:
    - level1-server
    - patch
    - rule_3.1.2
    - wireless
    - NIST800-53R5_CM-7
  vars:
    warn_control_id: '3.1.2'
  block:
    - name: "3.1.2 | PATCH | Ensure wireless interfaces are not available | find wireless files"
      ansible.builtin.find:
        path: /lib/modules/{{ ansible_facts['kernel'] }}/kernel/drivers/net/wireless
        patterns: "*.ko"
      register: discovered_loaded_wireless_modules

    - name: "3.1.2 | PATCH | Ensure wireless interfaces are not available | add to blacklist"
      when: discovered_loaded_wireless_modules.matched > 0
      ansible.builtin.template:
        src: etc/modprobe.d/blacklist-wireless.conf.j2
        dest: /etc/modprobe.d/blacklist-wireless.conf
        owner: root
        group: root
        mode: 'go-rwx'

- name: "3.1.3 | PATCH | Ensure bluetooth services are not in use"
  when: ubtu22cis_rule_3_1_3
  tags:
    - level1-server
    - level2-workstation
    - patch
    - bluetooth
    - rule_3.1.3
    - NIST800-53R5_CM-7
  block:
    - name: "3.1.3 | PATCH | Ensure bluetooth services are not in use | pkg"
      when:
        - not ubtu22cis_bluetooth_service
        - not ubtu22cis_bluetooth_mask
      ansible.builtin.package:
        name: bluez
        state: absent
        lock_timeout: "{{ ubtu22cis_apt_lock_timeout }}"

    - name: "3.1.3 | PATCH | Ensure bluetooth services are not in use | mask"
      when:
        - not ubtu22cis_bluetooth_service
        - ubtu22cis_bluetooth_mask
      notify: Systemd daemon reload
      ansible.builtin.systemd:
        name: bluetooth.service
        enabled: "{{ ('bluez' in ansible_facts['packages']) | ternary(false, omit) }}"
        state: "{{ ('bluez' in ansible_facts['packages']) | ternary('stopped', omit) }}"
        masked: true
