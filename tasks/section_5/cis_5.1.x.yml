---

- name: "5.1.1 | Ensure access to /etc/ssh/sshd_config is configured"
  when: ubtu22cis_rule_5_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - permissions
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - rule_5.1.1
  block:
    - name: "5.1.1 | Ensure access to /etc/ssh/sshd_config is configured"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
      loop: "{{ prelim_sshd_configs.files }}"

    - name: "5.1.1 | Ensure access to /etc/ssh/sshd_config is configured"
      ansible.builtin.file:
        path: "{{ ubtu22cis_sshd_config_file }}"
        owner: root
        group: root
        mode: 'go-rwx'

- name: "5.1.2 | PATCH | Ensure access to SSH private host key files is configured"
  when: ubtu22cis_rule_5_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - permissions
    - NIST800-53R5_CM-6
    - CCI-000366
    - rule_5.1.2
  block:
    - name: "5.1.2 | AUDIT | Ensure access to SSH private host key files is configured | Find the SSH private host keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key'
        recurse: true
        file_type: any
      register: discovered_ssh_private_host_key

    - name: "5.1.2 | PATCH | Ensure access to SSH private host key files is configured | Set permissions on SSH private host keys"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: "{{ 'ssh_keys' if (item.gr_name == 'ssh_keys') else 'root' }}"
        mode: "{{ 'u-x,g-wx,o-rwx' if (item.gr_name == 'ssh_keys') else 'u-x,go-rwx' }}"
      loop: "{{ discovered_ssh_private_host_key.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "5.1.3 | PATCH | Ensure access to SSH public host key files is configured"
  when: ubtu22cis_rule_5_1_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - NIST800-53R5_AC-3
    - NIST800-53R5_CM-6
    - NIST800-53R5_MP-2
    - rule_5.1.3
  block:
    - name: "5.1.3 | AUDIT | Ensure access to SSH public host key files is configured | Find the SSH public host keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key.pub'
        recurse: true
        file_type: any
      register: discovered_ssh_public_host_key

    - name: "5.1.3 | PATCH | Ensure access to SSH public host key files is configured | Set permissions on SSH public host keys"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'go-wx'
      loop: "{{ discovered_ssh_public_host_key.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "5.1.4 | PATCH | Ensure SSH access is configured"
  when:
    - ubtu22cis_rule_5_1_4
    - ubtu22cis_sshd_limited
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - rule_5.1.4
  block:
    - name: "5.1.4 | PATCH | Ensure SSH access is configured | Add line to sshd_config for allowusers"
      when: "ubtu22cis_sshd_allowusers | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ ubtu22cis_sshd_config_file }}"
        regexp: "^AllowUsers"
        line: AllowUsers {{ ubtu22cis_sshd_allowusers }}
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure SSH access is configured | Add line to sshd_config for allowgroups"
      when: "ubtu22cis_sshd_allowgroups | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ ubtu22cis_sshd_config_file }}"
        regexp: "^AllowGroups"
        line: AllowGroups {{ ubtu22cis_sshd_allowgroups }}
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure SSH access is configured | Add line to sshd_config for denyusers"
      when: "ubtu22cis_sshd_denyusers | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ ubtu22cis_sshd_config_file }}"
        regexp: "^DenyUsers"
        line: DenyUsers {{ ubtu22cis_sshd_denyusers }}
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure SSH access is configured | Add line to sshd_config for denygroups"
      when: "ubtu22cis_sshd_denygroups | length > 0"
      ansible.builtin.lineinfile:
        path: "{{ ubtu22cis_sshd_config_file }}"
        regexp: "^DenyGroups"
        line: DenyGroups {{ ubtu22cis_sshd_denygroups }}
      notify: Restart sshd

- name: "5.1.5 | PATCH | Ensure sshd Banner is configured"
  when: ubtu22cis_rule_5_1_5
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - rule_5.1.5
  notify: Restart sshd
  ansible.builtin.replace:
    path: "{{ ubtu22cis_sshd_config_file }}"
    regexp: ^(#?)\s*Banner.*$
    replace: Banner /etc/issue.net

- name: "5.1.6 | PATCH | Ensure sshd Ciphers are configured"
  when: ubtu22cis_rule_5_1_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - ciphers
    - NIST800-53R5_SC-8
    - rule_5.1.6
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^Ciphers
    line: "Ciphers {{ ubtu22cis_sshd_ciphers | join(',') }}"
    insertafter: '^# Ciphers and keying'
    validate: 'sshd -t -f %s'
  notify: Restart sshd

- name: "5.1.7 | PATCH | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured"
  when: ubtu22cis_rule_5_1_7
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - rule_5.1.7
  notify: Restart sshd
  block:
    - name: "5.1.7 | PATCH | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured | Add line in sshd_config for ClientAliveInterval"
      ansible.builtin.lineinfile:
        path: "{{ ubtu22cis_sshd_config_file }}"
        regexp: '^ClientAliveInterval'
        line: "ClientAliveInterval {{ ubtu22cis_sshd_clientaliveinterval }}"
        validate: sshd -t -f %s

    - name: "5.1.7 | PATCH | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured | Ensure SSH ClientAliveCountMax set to <= 3"
      ansible.builtin.lineinfile:
        path: "{{ ubtu22cis_sshd_config_file }}"
        regexp: '^ClientAliveCountMax'
        line: "ClientAliveCountMax {{ ubtu22cis_sshd_clientalivecountmax }}"
        validate: sshd -t -f %s

- name: "5.1.8 | PATCH | Ensure sshd DisableForwarding is enabled"
  when: ubtu22cis_rule_5_1_8
  tags:
    - level2-server
    - level1-workstation
    - automated
    - patch
    - sshd
    - NIST800-53R5_CM-7
    - rule_5.1.8
  block:
    - name: "5.1.8 | PATCH | Ensure sshd DisableForwarding is enabled"
      ansible.builtin.replace:
        path: "{{ ubtu22cis_sshd_config_file }}"
        regexp: (?i)^(#?)\s*DisableForwarding (no|false)
        replace: 'DisableForwarding yes'
        validate: sshd -t -f %s

    - name: "5.1.8 | PATCH | Ensure sshd DisableForwarding is enabled"
      ansible.builtin.lineinfile:
        path: "{{ ubtu22cis_sshd_config_file }}"
        line: 'DisableForwarding yes'
        validate: sshd -t -f %s

    - name: "5.1.8 | PATCH | Ensure sshd DisableForwarding is enabled | ensure x11 disabled"
      ansible.builtin.replace:
        path: "{{ ubtu22cis_sshd_config_file }}"
        regexp: (?i)^\s*X11Forwarding\s*(yes|no)
        replace: '# X11Forwarding no'
        validate: sshd -t -f %s

