- name: "1.6.4 | PATCH | Ensure access to /etc/motd is configured"
  when: ubtu22cis_rule_1_6_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.6.4
    - permissions
    - motd
