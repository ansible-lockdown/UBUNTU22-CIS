---

- name: "1.6.1 | PATCH | Ensure /etc/motd is configured"
  when: ubtu22cis_rule_1_6_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.6.1
    - motd
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-3
    - NIST800-53R5_CM-6
  block:
    - name: "1.6.1 | PATCH | Ensure /etc/motd is configured | motd"
      ansible.builtin.template:
        src: etc/motd.j2
        dest: /etc/motd
        owner: root
        group: root
        mode: 'u-x,go-wx'

    - name: "1.6.1 | PATCH | Ensure /etc/motd is configured | disable dynamic_motd"
      when: ubtu22cis_disable_dynamic_motd
      ansible.builtin.lineinfile:
        path: /etc/pam.d/sshd
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backrefs: true
      loop:
        - { regexp: '(session\s+optional\s+pam_motd.so\s+motd=/run/motd.dynamic)', line: '# \1' }
        - { regexp: '(session\s+optional\s+pam_motd.so noupdate)', line: '# \1' }
        - { regexp: '# Pam_motd.so disabled for CIS benchmark', line: '# Pam_motd.so disabled for CIS benchmark' }

- name: "1.6.2 | PATCH | Ensure /etc/issue is configured"
  when: ubtu22cis_rule_1_6_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.6.2
    - banner
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-3
    - NIST800-53R5_CM-6
  block:
    - name: "1.6.2 | PATCH | Ensure /etc/issue is configured | issue"
      ansible.builtin.template:
        src: etc/issue.j2
        dest: /etc/issue
        owner: root
        group: root
        mode: 'u-x,go-wx'

    - name: "1.6.2 | PATCH | Ensure /etc/issue is configured | issue"
      community.general.dpkg_divert:
        path: /etc/issue

