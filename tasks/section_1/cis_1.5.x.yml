---

- name: "1.5.1 | PATCH | Ensure randomize_va_space is configured | Set active kernel parameter"
  when: ubtu22cis_rule_1_5_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.1
    - aslr
    - NIST800-53R5_CM-6
  ansible.posix.sysctl:
    name: kernel.randomize_va_space
    value: 2
    state: present
    sysctl_file: "{{ ubtu22cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.2 | PATCH | Ensure ptrace_scope is configured"
  when: ubtu22cis_rule_1_5_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.2
    - ptrace
    - NIST800-53R5_CM-6
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: "{{ ubtu22cis_ptrace_scope }}"
    state: present
    sysctl_file: "{{ ubtu22cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.3 | PATCH | Ensure suid_dumpable is configured"
  when: ubtu22cis_rule_1_5_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.3
    - coredump
    - NIST800-53R5_CM-6
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: '0'
    state: present
    sysctl_file: "{{ ubtu22cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.4 | PATCH | Ensure core file size is configured"
  when: ubtu22cis_rule_1_5_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.4
    - coredump
    - NIST800-53R5_CM-6
  ansible.builtin.lineinfile:
    path: /etc/security/limits.d/60-limits.conf
    regexp: '^\* hard core'
    line: '* hard core 0'
    create: true
    owner: root
    group: root
    mode: 'go-wx'

- name: "1.5.5 | PATCH | Ensure prelink is not installed"
  when: ubtu22cis_rule_1_5_5
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.5
    - prelink
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-3
    - NIST800-53R5_CM-6
  block:
    - name: "1.5.5 | PATCH | Ensure prelink is not installed | Restore binaries to normal"
      when: "'prelink' in ansible_facts.packages"
      ansible.builtin.command: prelink -ua
      changed_when: false
      failed_when: false

    - name: "1.5.4 | PATCH | Ensure prelink is not installed | Remove prelink package"
      ansible.builtin.package:
        name: prelink
        state: absent
        purge: "{{ ubtu22cis_purge_apt }}"

- name: "1.5.6 | PATCH | Ensure Automatic Error Reporting is not enabled"
  when: ubtu22cis_rule_1_5_6
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.5
    - apport
    - NIST800-53R5_NA
  block:
    - name: "1.5.6 | PATCH | Ensure Automatic Error Reporting is not enabled | disable"
      ansible.builtin.lineinfile:
        path: /etc/default/apport
        regexp: ^enabled
        line: enabled=0
        create: true
        owner: root
        group: root
        mode: 'go-wx'

    - name: "1.5.6 | PATCH | Ensure Automatic Error Reporting is not enabled | remove package"
      ansible.builtin.package:
        name: apport
        state: absent
        purge: "{{ ubtu22cis_purge_apt }}"
