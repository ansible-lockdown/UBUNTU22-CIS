---

- name: "6.1.3.1 | PATCH | Ensure access to all logfiles has been configured"
  when: ubtu22cis_rule_6_1_3_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - logfiles
    - rule_6.1.3.1
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "6.1.3.1 | AUDIT | Ensure access to all logfiles has been configured | find files"
      ansible.builtin.shell: find /var/log/ -type f -exec ls {} \;
      changed_when: false
      failed_when: discovered_logfiles.rc not in [0, 1]
      check_mode: false
      register: discovered_logfiles

    - name: "6.1.3.1 | PATCH | Ensure access to all logfiles has been configured | change permissions"
      when:
        - item != "/var/log/btmp"
        - item != "/var/log/utmp"
        - item != "/var/log/wtmp"
        - item != "/var/log/lastlog"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'u-x,g-wx,o-rwx'
      loop: "{{ discovered_logfiles.stdout_lines }}"
      failed_when: discovered_logfile_perms.state not in '[ file, absent ]'
      register: discovered_logfile_perms

    - name: "6.1.3.1 | PATCH | Ensure access to all logfiles has been configured | change permissions on login records and sssd logs"
      when: item in ["/var/log/btmp", "/var/log/utmp", "/var/log/wtmp", "/var/log/lastlog"] or ('sssd' in item or 'SSSD' in item)
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'ug-x,o-wx'
      loop: "{{ discovered_logfiles.stdout_lines }}"
      failed_when: discovered_system_logfile_perms.state not in '[ file, absent ]'
      register: discovered_system_logfile_perms
